function resolve(){const u=routeURL();route=u.pathname;const category=u.searchParams.get('category')||'ALL';filter=categories.some(x=>x[0]===category)?category:'ALL';search=(u.searchParams.get('q')||'').slice(0,100);render()}
function header(){return `<div class="announcement"><span>${icon('truck',16)} FREE SHIPPING ON ORDERS OVER $100</span><a href="#newsletter" data-action="newsletter">Get 10% off your first order ${icon('arrow',14)}</a></div><header class="header"><a class="logo" href="/" data-link><span class="tomato-mark">🍅</span><span>TOMATO</span></a><nav class="nav"><a data-link href="/" class="${route==='/'?'active':''}">Home</a><a data-link href="/shop">Shop⌄</a><a data-link href="/shop?sort=new">New Arrivals</a><a data-link href="/shop">Collections⌄</a><a data-link href="/about">About</a><a data-link href="/contact">Contact</a></nav><div class="actions"><button aria-label="Search" data-action="search">${icon('search',22)}</button><button aria-label="Account" data-action="account">${icon('user',21)}</button><button aria-label="Wishlist" data-action="wishlist">${icon('heart',22)}${favorites.length?`<small>${favorites.length}</small>`:''}</button><button aria-label="Shopping bag" data-action="cart">${icon('bag',22)}<small>${count()}</small></button><button class="hamburger" aria-label="Menu" data-action="mobile">${icon('menu',23)}</button></div></header>`}
function productCard(p){let fav=favorites.includes(p.id);return `<article class="product-card"><a href="/product/${p.id}" data-link class="product-img"><img src="${assetURL(p.image)}" alt="${p.name}" loading="lazy"><span class="product-tag">${p.tag}</span></a><button aria-label="${fav?'Remove from':'Add to'} wishlist: ${p.name}" aria-pressed="${fav}" class="heart ${fav?'selected':''}" data-fav="${p.id}">${icon('heart',21)}</button><div class="product-info"><div class="swatches">${p.colors.map(c=>`<i style="background:${c}"></i>`).join('')}</div><a href="/product/${p.id}" data-link class="product-name">${p.name}</a><div class="prices">${money(p.price)} <s>${money(p.old)}</s></div><div class="rating"><span>★★★★★</span> <em>(${p.reviews})</em></div><button class="add-btn" data-add="${p.id}">${icon('bag',17)} ADD TO CART</button></div></article>`}
function home(){return `<section class="hero hero-slide-${slide}"><div class="hero-shading"></div><img class="hero-model" src="${assetURL('hero-model.webp')}" alt="Model in bold red fashion"><img class="hero-bag" src="${assetURL('hero-bag.webp')}" alt="TOMATO shopping bag"><div class="hero-copy">${[['NEW SEASON','Quick and<br>hassle-free<br><em>shopping</em>','Modern fashion for your everyday story.<br>Trendy styles with effortless looks.'],['THE EDIT','Style that<br>speaks<br><em>bolder</em>','Discover statement looks and everyday favourites.<br>Made for your unique style.'],['DISCOVER TOMATO','Your next<br>favourite<br><em>look</em>','Fresh arrivals, effortless styling.<br>Find something that feels like you.']][slide].map((t,i)=>i===0?`<div class="eyebrow red">${t}</div>`:i===1?`<h1>${t}</h1>`:`<p>${t}</p>`).join('')}<a href="/shop" data-link class="primary-btn">SHOP NOW ${icon('arrow',18)}</a><div class="slider-dots"><button aria-label="Show slide 1" data-slide="0" class="${slide===0?'selected':''}">01</button><button aria-label="Show slide 2" data-slide="1" class="${slide===1?'selected':''}">02</button><button aria-label="Show slide 3" data-slide="2" class="${slide===2?'selected':''}">03</button></div></div><button class="hero-left circle-arrow" aria-label="Previous slide" data-slide="${(slide+2)%3}">‹</button><button class="hero-right circle-arrow" aria-label="Next slide" data-slide="${(slide+1)%3}">›</button><div class="hero-script">Fashion<br>Lives<br>Bolder.</div></section><section class="category-section texture"><div class="section-heading"><div><div class="eyebrow">EXPLORE</div><h2>Shop by Category</h2></div><a href="/shop" data-link>View All Categories ${icon('arrow',17)}</a></div><div class="categories">${categories.map((c,i)=>`<a href="/shop?category=${encodeURIComponent(c[0])}" data-link class="category-card"><img src="${assetURL('category-'+(i+1)+'.webp')}" alt="${c[0]} clothing"><div class="category-caption"><span><b>${c[0]}</b><small>${c[1]}</small></span><i>${icon('arrow',17)}</i></div></a>`).join('')}</div></section><section class="arrivals"><img src="${assetURL('arrival-model.webp')}" alt="New TOMATO fashion arrivals"><div class="arrival-copy"><div class="eyebrow">FRESH STYLES</div><h2>New<br>Arrivals</h2><p>Discover the latest collection<br>crafted for a bolder you.</p><a data-link href="/shop?sort=new" class="white-btn">SHOP NOW ${icon('arrow',18)}</a></div><div class="arrival-perks">${[['diamond','Premium Fabric','All-day comfort'],['shirt','Modern Designs','For every occasion'],['leaf','Limited Collection','Be unique, always']].map(x=>`<div><i>${icon(x[0],24)}</i><span><strong>${x[1]}</strong><small>${x[2]}</small></span></div>`).join('')}</div></section><section class="trending texture"><div class="section-heading"><div><div class="eyebrow">TRENDING NOW</div><h2>Trending Products</h2></div><a href="/shop" data-link>View All Products ${icon('arrow',17)}</a></div><div class="featured-grid">${products.slice(0,5).map(productCard).join('')}</div></section>${perks()}${newsletter()}`}
function perks(){return `<section class="perks">${[['truck','Free Shipping','On orders over $100'],['box','Easy Returns','Hassle-free returns'],['shield','Secure Shopping','Payments coming soon'],['headphones','Customer Support',"We're here to help"]].map(p=>`<div class="perk"><span class="perk-icon">${icon(p[0],30)}</span><span><strong>${p[1]}</strong><small>${p[2]}</small></span></div>`).join('')}</section>`}
function newsletter(){return `<section class="newsletter" id="newsletter"><div><h2>Join Our Fashion Community</h2><p>Subscribe for style updates, new arrivals, exclusive offers<br>and a 10% off on your first order.</p></div><form id="newsletter-form"><label class="sr-only" for="email">Email address</label><div>${icon('mail',17)}<input id="email" type="email" required placeholder="Enter your email address"></div><button type="submit">SUBSCRIBE</button></form></section>`}
function footer(){return `<footer><div class="footer-main"><div class="brand-footer"><a class="logo" href="/" data-link><span class="tomato-mark">🍅</span>TOMATO</a><p>Modern fashion for a bolder tomorrow.</p><div class="socials"></div></div><div class="footer-col"><b>Quick Links</b><a href="/" data-link>Home</a><a href="/shop" data-link>Shop</a><a href="/shop?sort=new" data-link>New Arrivals</a><a href="/shop" data-link>Collections</a><a href="/about" data-link>About</a><a href="/contact" data-link>Contact</a></div><div class="footer-col"><b>Customer Care</b><a href="/contact" data-link>Order Enquiries</a><a href="/shipping" data-link>Shipping & Delivery</a><a href="/returns" data-link>Returns & Exchanges</a><a href="/faq" data-link>FAQ</a><a href="/contact" data-link>Size Enquiries</a></div><div class="footer-col contact-col"><b>Contact</b><a href="/contact" data-link>Contact the TOMATO team</a><span>Business contact details to be confirmed</span></div><img class="footer-shopping" src="${assetURL('footer-bag.webp')}" alt="TOMATO shopping bags"></div><div class="footer-bottom"><span>© 2026 Tomato. All rights reserved.</span><span><a href="/privacy" data-link>Privacy Policy</a>　 |　 <a href="/terms" data-link>Terms of Service</a>　 |　 <a href="/returns" data-link>Refund Policy</a></span></div></footer>`}
function shop(){let list=[...products];if(filter!=='ALL')list=list.filter(p=>p.category===filter);if(search)list=list.filter(p=>(p.name+' '+p.category).toLowerCase().includes(search.toLowerCase()));const s=new URLSearchParams(routeURL().search).get('sort')||sort;if(s==='price-low')list.sort((a,b)=>a.price-b.price);if(s==='price-high')list.sort((a,b)=>b.price-a.price);if(s==='new')list.sort((a,b)=>b.id-a.id);return `<main class="page"><div class="breadcrumb"><a href="/" data-link>Home</a> / Shop ${filter!=='ALL'?'/ '+escapeHtml(filter):''}</div><div class="page-title"><div class="eyebrow red">CURATED FOR YOU</div><h1>${search?'Search results':filter==='ALL'?'Shop All Styles':escapeHtml(filter)}</h1><p>Explore timeless essentials and bold new styles.</p></div><div class="shop-layout"><aside class="filter-panel"><h3>Categories</h3>${['ALL',...categories.map(x=>x[0])].map(c=>`<button class="filter ${filter===c?'on':''}" data-category="${c}">${c==='ALL'?'All Clothing':c}<span>›</span></button>`).join('')}<div class="filter-note">Free shipping on orders over $100</div></aside><section class="shop-main"><div class="shop-toolbar"><span>${list.length} products</span><label>Sort by <select id="sort-select"><option value="featured" ${s==='featured'?'selected':''}>Featured</option><option value="new" ${s==='new'?'selected':''}>Newest</option><option value="price-low" ${s==='price-low'?'selected':''}>Price: Low to High</option><option value="price-high" ${s==='price-high'?'selected':''}>Price: High to Low</option></select></label></div>${list.length?`<div class="shop-grid">${list.map(productCard).join('')}</div>`:`<div class="empty">No products found. <a href="/shop" data-link>View all clothing</a></div>`}</section></div></main>`}
function productPage(){let p=products.find(p=>p.id===Number(route.split('/')[2]));if(!p)return notFound();detail=p.id;return `<main class="page"><div class="breadcrumb"><a href="/" data-link>Home</a> / <a href="/shop" data-link>Shop</a> / ${p.name}</div><div class="detail-layout"><div class="detail-photo"><img src="${assetURL(p.image)}" alt="${p.name}"></div><div class="detail-copy"><div class="eyebrow red">${p.tag.toUpperCase()}</div><h1>${p.name}</h1><div class="detail-rating">★★★★★ <span>${p.rating} · ${p.reviews} reviews</span></div><div class="detail-price">${money(p.price)} <s>${money(p.old)}</s></div><p>Elevate your wardrobe with our carefully chosen TOMATO Clothing collection. Designed to balance everyday comfort with confident style.</p><h4>Choose your colour</h4><div class="detail-swatches">${p.colors.map(c=>`<span style="background:${c}" title="Colour illustration — availability to be confirmed"></span>`).join('')}</div><small>Colour options are illustrative. Confirm availability before purchase.</small><h4>Size</h4><div class="sizes">${['XS','S','M','L','XL','XXL'].map(s=>`<button data-size="${s}" class="${size===s?'chosen':''}">${s}</button>`).join('')}</div><button class="primary-btn wide" data-add="${p.id}">${icon('bag')} ADD TO CART — ${money(p.price)}</button><button class="outline-btn wide" data-fav="${p.id}">${icon('heart')} ${favorites.includes(p.id)?'REMOVE FROM':'ADD TO'} WISHLIST</button><div class="product-promise">${icon('truck')} Free shipping over $100　 ·　 Easy returns</div></div></div><h2 class="recommended-title">You may also like</h2><div class="shop-grid">${products.filter(x=>x.id!==p.id).slice(0,4).map(productCard).join('')}</div></main>`}
function notFound(){return `<main class="page content-page"><h1>Page not found</h1><p>We couldn't find that page.</p><a href="/shop" data-link class="outline-btn">BROWSE PRODUCTS</a></main>`}
function basicPage(){let key=route.substring(1);const content={about:['About TOMATO','Fashion lives bolder.','TOMATO Clothing celebrates confidence, style and individuality. From beautiful everyday essentials to statement pieces, our collections make dressing up feel effortless.'],contact:['Contact Us','We would love to hear from you.','Questions about your order, product sizing or shopping with TOMATO? Send us a message using the form below.'],shipping:['Shipping & Delivery','Delivery made simple.','Shipping costs and estimated delivery dates are shown at checkout. Free shipping is available on qualifying orders over $100.'],returns:['Returns & Exchanges','Shop with confidence.','Please contact our support team to ask about a return or exchange before sending an item back. Return eligibility and timeframes will be confirmed by our team.'],faq:['Frequently Asked Questions','Answers to common questions.','For sizing, shipping, payment and order support, please contact our team. Detailed policies will be added before launch.'],privacy:['Privacy Policy','Your privacy matters.','This is a frontend demonstration. Connect and publish your actual privacy policy before accepting live customer orders.'],terms:['Terms of Service','Terms and conditions.','This is a frontend demonstration. Add your approved store terms before launching real transactions.']};let c=content[key];if(!c)return notFound();return `<main class="page content-page"><div class="eyebrow red">TOMATO CLOTHING</div><h1>${c[0]}</h1><h2>${c[1]}</h2><p>${c[2]}</p>${key==='contact'?`<form id="contact-form" class="contact-form"><input required placeholder="Your name"><input type="email" required placeholder="Email address"><textarea required rows="5" placeholder="How can we help?"></textarea><button class="primary-btn" type="submit">SEND MESSAGE ${icon('arrow')}</button></form>`:''}<a class="outline-btn" href="/shop" data-link>EXPLORE OUR COLLECTION ${icon('arrow')}</a></main>`}
function drawerMarkup(){if(!drawer)return '';let content='';if(drawer==='cart'){let total=cart.reduce((sum,item)=>sum+products.find(p=>p.id===item.id).price*item.qty,0);content=`<h2>Your Shopping Bag <small>(${count()})</small></h2>${cart.length?`<div class="drawer-items">${cart.map(item=>{let p=products.find(p=>p.id===item.id);return `<div class="cart-line"><img src="${assetURL(p.image)}" alt="${p.name}"><div><b>${p.name}</b><small>Size: ${item.size}</small><strong>${money(p.price)}</strong><div class="qty"><button data-qty="${item.id}|${item.size}|-1">−</button>${item.qty}<button data-qty="${item.id}|${item.size}|1">+</button></div></div><button data-remove="${item.id}|${item.size}" aria-label="Remove item">${icon('close',17)}</button></div>`}).join('')}</div><div class="drawer-bottom"><div class="subtotal"><strong>Subtotal</strong><strong>${money(total)}</strong></div><small>Shipping and payment are not connected in this demo.</small><button class="primary-btn wide" data-action="checkout">CHECKOUT ${icon('arrow')}</button></div>`:`<div class="empty-drawer">${icon('bag',54)}<h3>Your bag is empty</h3><p>Discover something you love.</p><button class="primary-btn" data-action="close">CONTINUE SHOPPING</button></div>`}`}
if(drawer==='wishlist')content=`<h2>Your Wishlist</h2>${favorites.length?`<div class="drawer-items">${products.filter(p=>favorites.includes(p.id)).map(p=>`<div class="wishlist-line"><img src="${assetURL(p.image)}" alt="${p.name}"><div><b>${p.name}</b><strong>${money(p.price)}</strong><button data-add="${p.id}" class="outline-btn">Add to bag</button></div><button data-fav="${p.id}">${icon('close')}</button></div>`).join('')}</div>`:`<div class="empty-drawer">${icon('heart',50)}<h3>No saved styles yet</h3><p>Tap the heart on any product to save it.</p></div>`}`;
if(drawer==='search')content=`<h2>Search the Collection</h2><form id="search-form" class="drawer-search"><input name="q" placeholder="Search clothing, categories..." autofocus required value="${escapeHtml(search)}"><button class="primary-btn">${icon('search')}</button></form><p>Popular searches</p>${['JAMA','HIJAB','T-SHIRT','BORKA'].map(x=>`<button class="search-chip" data-category="${x}">${x}</button>`).join('')}`;
if(drawer==='mobile')content=`<h2>Menu</h2>${[['Home','/'],['Shop All','/shop'],['New Arrivals','/shop?sort=new'],['Collections','/shop'],['About Us','/about'],['Contact','/contact']].map(([t,u])=>`<a class="mobile-link" href="${u}" data-link>${t} ${icon('arrow')}</a>`).join('')}`;
if(drawer==='account')content=`<h2>My Account</h2><p>Welcome to TOMATO Clothing.</p><p>Sign-in and order history require a connected customer account service.</p><button class="outline-btn wide" data-action="close">CONTINUE SHOPPING</button>`;
if(drawer==='checkout')content=`<h2>Checkout Preview</h2><p>This is a working frontend demo. Real payment processing, order storage, taxes and shipping integrations are not connected.</p><div class="notice">Your cart is saved in this browser. No payment will be taken.</div><button class="primary-btn wide" data-action="cart">RETURN TO BAG</button>`;
return `<div class="drawer-overlay" data-action="close"></div><aside class="drawer"><button class="drawer-close" data-action="close" aria-label="Close">${icon('close',22)}</button>${content}</aside>`}
function render(){drawer && (document.body.style.overflow='hidden');if(!drawer)document.body.style.overflow='';document.title=(route==='/'?'TOMATO Clothing':route==='/shop'?'Shop All | TOMATO Clothing':'TOMATO Clothing');$('#app').innerHTML=header()+(route==='/'?home():route==='/shop'?shop():route.startsWith('/product/')?productPage():basicPage())+footer()+drawerMarkup();
// Use real hash links to preserve open-in-new-tab and mobile navigation.
document.querySelectorAll('a[data-link]').forEach(a=>{const href=a.getAttribute('href');if(href&&href.startsWith('/'))a.setAttribute('href','#'+href)})}
function toast(msg){let t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function add(id){let p=products.find(p=>p.id===id);if(!p)return;let s=route.startsWith('/product/')?size:'M';let item=cart.find(x=>x.id===id&&x.size===s);if(item){if(item.qty>=50){toast('Maximum 50 units per size');return}item.qty++}else cart.push({id,size:s,qty:1});save();render();toast(p.name+' added to your bag')}
document.addEventListener('click',e=>{let link=e.target.closest('[data-link]');if(link){e.preventDefault();drawer='';go(link.getAttribute('href'));return}let a=e.target.closest('[data-action]');if(a){let v=a.dataset.action;if(v==='newsletter'){e.preventDefault();drawer='';if(route!=='/')go('/');document.querySelector('#newsletter')?.scrollIntoView({behavior:'smooth'});return}if(v==='checkout'){toast('Checkout is not connected yet. This is a storefront demo.');return}if(v==='account'){drawer='account';render();return}drawer=v==='close'?'':v;render();return}let addBtn=e.target.closest('[data-add]');if(addBtn){add(Number(addBtn.dataset.add));return}let fav=e.target.closest('[data-fav]');if(fav){let id=Number(fav.dataset.fav);favorites=favorites.includes(id)?favorites.filter(x=>x!==id):[...favorites,id];save();render();toast(favorites.includes(id)?'Added to wishlist':'Removed from wishlist');return}let cat=e.target.closest('[data-category]');if(cat){drawer='';go('/shop'+(cat.dataset.category==='ALL'?'':'?category='+encodeURIComponent(cat.dataset.category)));return}let sz=e.target.closest('[data-size]');if(sz){size=sz.dataset.size;render();return}let q=e.target.closest('[data-qty]');if(q){let [id,s,d]=q.dataset.qty.split('|');let item=cart.find(x=>x.id===Number(id)&&x.size===s);if(item){item.qty=Math.min(50,item.qty+Number(d));if(item.qty<=0)cart=cart.filter(x=>x!==item)}save();render();return}let rem=e.target.closest('[data-remove]');if(rem){let [id,s]=rem.dataset.remove.split('|');cart=cart.filter(x=>x.id!==Number(id)||x.size!==s);save();render();return}let sl=e.target.closest('[data-slide]');if(sl){slide=Number(sl.dataset.slide);render();return}});
document.addEventListener('change',e=>{if(e.target.id==='sort-select'){let url=routeURL();url.searchParams.set('sort',e.target.value);go(url.pathname+url.search)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer){drawer='';render()}});
document.addEventListener('submit',e=>{if(e.target.id==='newsletter-form'){e.preventDefault();toast('Newsletter preview only — email signup is not connected yet.');return}if(e.target.id==='search-form'){e.preventDefault();let val=new FormData(e.target).get('q');drawer='';go('/shop?q='+encodeURIComponent(val));return}if(e.target.id==='contact-form'){e.preventDefault();toast('Demo only: connect a form service to send messages.')}});
resolve();

</script></body></html>
